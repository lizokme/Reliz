<!DOCTYPE html>
<html lang="uk">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Oasis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
</head>


<body>
    <header>
        <div class="top-panel-road-style">
            <div class="road-markings left-marks">
                <span></span>
                <span></span>
            </div>


            <form id="searchForm" class="search-bar-container" role="search">
                <input type="search" placeholder="search..." class="search-input">
                <button class="search-button btn-search" type="submit"><i class="fas fa-search"></i></button>
            </form>


            <div class="road-markings right-marks">
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="space"></div>
        <div class="header-banner">
            <div class="top-right-icons">
                <button class="btn-cart" id="cartBtn">
                <span class="icon"><i class="bi bi-cart"></i></span>
                <span class="cart-counter">0</span>
            </button>
               
            </div>
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
        </div>
    </header>
    <main class="main-container">
        <section class="features">
            <div class="feature-item">
                <i class="fas fa-shipping-fast"></i>
                <p>Доставка по всій Україні</p>
            </div>
            <div class="feature-item">
                <i class="fas fa-phone-alt"></i>
                <p>Цілодобове обслуговування</p>
            </div>
            <div class="feature-item">
                <i class="fas fa-undo-alt"></i>
                <p>Гарантія повернення</p>
            </div>
        </section>


        <section class="products">




            <div class="container-cards products-list">




            </div>


        </section>


         <div class="more-products-area">
            <button class="more-products-button">
                More Of Good Products <i class="fas fa-chevron-right"></i>
            </button>
            <p class="popular-things">
                Popular Things <i class="fas fa-chevron-down"></i>
            </p>
        </div>
        <section class="products">
            <div class="product-card">
                <img src="img/image 15.png" height="200px" alt="Подушка “Дуже приємно, Бог”">
                <div class="product-details">
                    <p class="product-title">Подушка “Дуже приємно, Бог”</p>
                    <p class="product-descr">Розмір 40Х80 см.</p>
                </div>
            </div>
            <div class="product-card">
                <img src="img/image 16.png" height="200px" alt="Світшот “Євангеліон. Аска”">
                <div class="product-details">
                    <p class="product-title">Світшот “Євангеліон. Аска”</p>
                    <p class="product-descr">60% бавовна, 40% поліестер, розміри XXS-XXL</p>
                </div>
            </div>
        </section>
        <section class="hashtag-section">
            <div class="hashtag-header">
                <p>Наш магазин у<i class="fab fa-instagram"></i></p>
            </div>
            <div class="last-three-blocks">
                <div class="product-card-last">
                    <img src="img/image 11.png" height="250px" width="250px" alt="Манга “Токійські месники”">
                </div>
                <div class="product-card-last">
                    <img src="img/image 20.png" height="250px" width="250px" alt="Подушка “Дуже приємно, Бог”">
                </div>
                <div class="product-card-last">
                    <img src="img/image 17.png" height="250px" width="250px" alt="Брелок “Джоджо”">
                </div>
            </div>
        </section>


        <footer class="footer">
            <p class="footer-text">Соціальні мережі</p>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-pinterest-p"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
            <button id="themeToggle"><i class="bi bi-brightness-high"></i></button>
        </footer>
    </main>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
